name: Publish to NuGet

# Runs when a version tag such as v3.0.0 is pushed. The tag must match the
# <Version> in Ranger.PasswordHash.csproj.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # required for NuGet trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Check tag matches project version
        run: |
          project_version=$(dotnet msbuild Ranger.PasswordHash/Ranger.PasswordHash.csproj -getProperty:Version)
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$project_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $project_version"
            exit 1
          fi

      - name: Test
        run: dotnet test --configuration Release

      - name: Pack
        run: dotnet pack Ranger.PasswordHash/Ranger.PasswordHash.csproj --configuration Release --output artifacts

      - name: Log in to NuGet
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
